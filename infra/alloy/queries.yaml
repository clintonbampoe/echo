pg_statement_text:
  query: |
    SELECT queryid::text AS queryid,
           max(left(regexp_replace(query, '\s+', ' ', 'g'), 110)) AS query,
           1 AS info
    FROM (
      (SELECT queryid, query FROM pg_stat_statements
        WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database()) AND queryid IS NOT NULL
        ORDER BY total_exec_time DESC LIMIT 40)
      UNION
      (SELECT queryid, query FROM pg_stat_statements
        WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database()) AND queryid IS NOT NULL
        ORDER BY calls DESC LIMIT 40)
    ) busiest
    GROUP BY queryid
  metrics:
    - queryid:
        usage: "LABEL"
        description: "The statement's query id, the same as on the pg_stat_statements metrics"
    - query:
        usage: "LABEL"
        description: "The first 110 characters of the normalised SQL"
    - info:
        usage: "GAUGE"
        description: "Always 1; join it to a pg_stat_statements metric on queryid to get the query label"
