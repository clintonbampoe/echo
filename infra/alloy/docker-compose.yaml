---
name: alloy
services:
  alloy:
    image: ${IMAGE_REGISTRY:-local}/echo-alloy:${IMAGE_TAG:-dev}
    build: .
    container_name: alloy
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpu_shares: 256
    hostname: ${ALLOY_HOST:-echo-app}
    environment:
      GOMEMLIMIT: 200MiB
      PG_MONITOR_DSN: ${PG_MONITOR_DSN}
      OBS_HOST: ${OBS_HOST:-}
      LOKI_URL: ${LOKI_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-}
      API_LOG_MIN_SEVERITY: ${API_LOG_MIN_SEVERITY:-13}
      TRACES_SAMPLE_PERCENT: ${TRACES_SAMPLE_PERCENT:-1}
    cgroup: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/udev:/run/udev:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    ports:
      - 127.0.0.1:12345:12345
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
    networks: [app]
networks:
  app:
    external: true
    name: echo_echo-network
volumes:
  alloy-data:
