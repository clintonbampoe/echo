name: alloy

services:
  alloy:
    build: .
    container_name: alloy
    restart: unless-stopped
    # Alloy runs on the app box, so it shares its 4 GB. It used 170 to 200 MB at the peak of a 420-user test.
    # GOMEMLIMIT makes its garbage collector work harder as it nears the limit, instead of being killed at it.
    mem_limit: 256m
    memswap_limit: 256m
    cpu_shares: 256
    # Names the machine in every metric and log ("host" label), instead of the container id.
    hostname: ${ALLOY_HOST:-echo-app}
    environment:
      GOMEMLIMIT: 200MiB
      PG_MONITOR_DSN: ${PG_MONITOR_DSN}
      # The observability server's private address. Empty means "the observability stack on this machine".
      OBS_HOST: ${OBS_HOST:-}
      # Optional overrides, for when one of the three is somewhere else. They win over OBS_HOST.
      LOKI_URL: ${LOKI_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-}
      # The lowest level of API log kept. 13 is warnings and above; 9 adds information.
      API_LOG_MIN_SEVERITY: ${API_LOG_MIN_SEVERITY:-13}
      # The share of ordinary traces kept, in percent. Failed, rejected (400, 403, 409, 429) and slow (over 100 ms) requests are always
      # kept. 100 keeps everything while debugging.
      TRACES_SAMPLE_PERCENT: ${TRACES_SAMPLE_PERCENT:-1}
    # cAdvisor reads the cgroup tree to find each container. A private cgroup namespace shows only Alloy's own.
    cgroup: host
    # Network use per container is read through each container's own process; needs the host's process list.
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
      # Read-only views of the host, for the container (cAdvisor) and machine (unix) exporters.
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/udev:/run/udev:ro
      # This host stores images through containerd, and cAdvisor asks it about each container.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [app]

networks:
  app:
    external: true
    name: echo_echo-network

volumes:
  alloy-data:
