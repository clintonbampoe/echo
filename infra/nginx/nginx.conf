# One worker per core of the server (2). "auto" would count the host's cores, which inside a container is
# not the number this container may use.
worker_processes 2;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;

    # Which requests reach the log. Every error (4xx, 5xx) is kept; of the rest, a random 1%. "sampled" is written
    # on each line, so a dashboard can turn the sample back into a count: lines with sampled=1, times 100. A slow
    # request is not kept on purpose (that would make the sample look slower than traffic is): the API's own metrics
    # hold every request's time, and Alloy writes a log line for every slow request from the API's spans (config.alloy).
    split_clients "${request_id}" $log_sampled {
        1% 1;
        *  0;
    }
    map "$status:$log_sampled" $log_it {
        ~^[45]..: 1;
        ~:1$      1;
        default   0;
    }

    # The trace id of a request. The API continues a trace when the request carries a traceparent header; a browser sends
    # none, so nginx starts one from its own request id (already 32 hex characters, the size of a trace id) and passes it
    # on. The log line carries the same id, so a slow request opens its trace and a trace opens its request. A caller's
    # own traceparent (the load test sends one) is kept as it is. The 01 flag asks the API to record the trace:
    # Alloy keeps the failed and slow ones and thins the rest (config.alloy).
    map $http_traceparent $trace_id {
        # Quoted, because the braces would otherwise be read as a block.
        "~^00-(?<caller_trace>[0-9a-f]{32})-"  $caller_trace;
        default                              $request_id;
    }
    map $http_traceparent $trace_parent {
        ""       "00-$request_id-0000000000000001-01";
        default  $http_traceparent;
    }

    # One JSON line per request, for Loki (Alloy turns "status" and "method" into labels). The path is $uri, which has
    # no query string, on purpose: query strings carry the email-verification and password-reset tokens, and a token
    # must never reach a log. "rt" is the whole request in seconds, "urt" the API's share of it.
    log_format echo escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"sampled":$log_sampled,"trace_id":"$trace_id","bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time","ip":"$remote_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout echo if=$log_it;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 2;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Cap upload size and refuse clients that trickle headers/body to hold
    # connections open. 10m covers any realistic receipt or member photo.
    client_max_body_size 5m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Per-IP rate limit, shared by the API locations. A church shares one address and a dashboard load asks for about
    # twenty things at once, so this is sized for an office (the 500-user test refused 0.28% of requests at 25 r/s
    # with a burst of 50). It is a coarse flood guard: the API counts each signed-in person on their own.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_status 429;

    # Idle connections to the API are kept open and reused (see proxy_http_version in api-locations.conf).
    # Without this every request opened, and closed, its own TCP connection to the API.
    upstream echo_api {
        server api:5025;
        keepalive 64;
    }

    # Extra settings that only some setups need (the load test mounts one here). Empty in production.
    include /etc/nginx/extra/*.conf;

    # The rest differs by environment. The Dockerfile copies site.conf (production)
    # or site.dev.conf (development) to this path.
    include /etc/nginx/site.conf;
}
