events {
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # One JSON line per request, for Loki (Alloy turns "status" and "method" into labels). The path is $uri, which has
    # no query string, on purpose: query strings carry the email-verification and password-reset tokens, and a token
    # must never reach a log. "rt" is the whole request in seconds, "urt" the API's share of it.
    log_format echo escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time","ip":"$remote_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout echo;
    error_log /dev/stderr warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Cap upload size and refuse clients that trickle headers/body to hold
    # connections open. 10m covers any realistic receipt or member photo.
    client_max_body_size 5m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Per-IP rate limit, shared by the API locations.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;
    limit_req_status 429;

    upstream echo_api {
        server api:5025;
    }

    # The rest differs by environment. The Dockerfile copies site.conf (production)
    # or site.dev.conf (development) to this path.
    include /etc/nginx/site.conf;
}
