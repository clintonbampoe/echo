events {}

http {
    # Cap upload size and refuse clients that trickle headers/body to hold
    # connections open. 10m covers any realistic receipt or member photo.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Per-IP rate limit, shared by the API locations below.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream echo_api {
        server api:8080;
    }

    upstream echo_client {
        server client:80;
    }

    server {
        listen 80;

        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://echo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /scalar {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://echo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://echo_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://echo_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
