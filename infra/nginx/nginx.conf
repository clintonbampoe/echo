worker_processes 2;

worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;

    split_clients "${request_id}" $log_sampled {
        1% 1;
        * 0;
    }
    map "$status:$log_sampled" $log_it {
        ~^[45]..: 1;
        ~:1$ 1;
        default 0;
    }

    map $http_traceparent $trace_id {
        "~^00-(?<caller_trace>[0-9a-f]{32})-" $caller_trace;
        default $request_id;
    }
    map $http_traceparent $trace_parent {
        "" "00-$request_id-0000000000000001-01";
        default $http_traceparent;
    }

    log_format echo escape=json
    '{"time":"$time_iso8601","method":"$request_method",'
    '"path":"$uri","status":$status,"sampled":$log_sampled,'
    '"trace_id":"$trace_id","bytes":$body_bytes_sent,'
    '"rt":$request_time,"urt":"$upstream_response_time",'
    '"ip":"$remote_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout echo if=$log_it;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 2;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript
    application/json image/svg+xml;

    client_max_body_size 5m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_status 429;

    upstream echo_api {
        server api:5025;
        keepalive 64;
    }

    include /etc/nginx/extra/*.conf;

    include /etc/nginx/site.conf;
}
