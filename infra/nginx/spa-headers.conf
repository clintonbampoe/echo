# Security headers for the web app's own pages and files. Included by each location that
# serves them. They are not set at server level because /api and /scalar send their own,
# and the API docs would break under this policy.
#
# The Content Security Policy is what keeps the localStorage session tokens safe from
# injected scripts. connect-src 'self' works because the API is on the same origin (/api).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
