# Development: the web app runs in the client container under Vite (hot reload).
# nginx passes everything that is not the API through to it.
upstream echo_client {
    server client:5173;
}

server {
    listen 80;

    include /etc/nginx/api-locations.conf;

    location / {
        proxy_pass http://echo_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hot reload talks to Vite over a WebSocket, which needs the upgrade headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
