# What both servers' nginx share for HTTPS. Included inside a `server { listen 443 ssl; }` block, after it names its
# certificate. No OCSP stapling: Let's Encrypt stopped running OCSP responders in 2025, so there is nothing to staple.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;

# Browsers keep to HTTPS for a year after the first visit. Not includeSubDomains: other hosts on the domain have
# their own say.
add_header Strict-Transport-Security "max-age=31536000" always;
# (The web app's own pages set their other headers in spa-headers.conf, which repeats this one: a location that
# sets any header of its own does not inherit these.)
