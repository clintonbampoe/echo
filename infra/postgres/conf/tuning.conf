# Tuned for the production box: 2 vCPU, 4 GB RAM, and this container limited to 2 GB (docker-compose.prod.yml).
# The same file is used in development, where the box is bigger and none of this hurts.

# The API's pool holds at most 30 connections; the rest is the three the superuser keeps back, the monitor role and
# a margin for migrations and psql. Each connection costs memory even when idle.
max_connections = 40

# Memory. The database is bigger than shared_buffers, so the rest of what is asked for comes from the operating
# system's page cache, which is why effective_cache_size is larger than shared_buffers.
shared_buffers = 768MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
autovacuum_work_mem = 64MB

# The disk is an SSD: a random read costs little more than a sequential one, and several can be in flight.
random_page_cost = 1.1
effective_io_concurrency = 200

# Every query here runs in milliseconds. Compiling one with JIT takes longer than running it.
jit = off

# A parallel query takes cores from the API and the other queries. With two cores shared, the work is better done
# by one process.
max_parallel_workers_per_gather = 0

# Fewer, larger checkpoints. A crash replays more WAL on restart (seconds), and writes are smoother in between.
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 512MB
wal_compression = lz4
