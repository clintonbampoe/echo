# Echo — Postgres configuration.
#
# The image keeps its stock postgresql.conf inside the data volume
# ($PGDATA/postgresql.conf). Postgres reads exactly one *primary* config file, so
# this file is that primary file: it pulls the stock one in, then adds ours on top.
#
# The server is started with:
#     postgres -c config_file=/etc/postgresql/postgresql.conf
# (docker-compose.yml)
#
# Why not just append to the stock file? Because the stock file lives in the
# data volume, not in the repository — anything written there is invisible to
# git and lost the moment the volume is rebuilt.

# The image's own configuration. Everything the image ships stays in force.
# PGDATA is the postgres:18 image's data directory; it moves if the image's
# major version changes.
include = '/var/lib/postgresql/18/docker/postgresql.conf'

# Our settings. include_dir reads every *.conf in the directory, and it runs
# after the include above, so our settings win.
include_dir = '/etc/postgresql/conf.d'

# hba_file and ident_file default to the directory of the *primary* config
# file, which is now /etc/postgresql — not the data volume. Point them back.
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'
