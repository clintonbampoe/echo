web:
  port: 8080

ui:
  title: Echo status
  header: Echo status

storage:
  type: sqlite
  path: /data/status.db

endpoint-defaults: &defaults
  interval: 30s
  client:
    timeout: 5s
    insecure: true

endpoints:
  - name: 1. API
    group: 1. Core
    url: https://nginx/api/health/ready
    <<: *defaults
    conditions: ["[STATUS] == 200"]
  - name: 2. Website
    group: 1. Core
    url: https://nginx/
    <<: *defaults
    conditions: ["[STATUS] == 200"]
  - name: 3. Database
    group: 1. Core
    url: tcp://db:5432
    <<: *defaults
    conditions: ["[CONNECTED] == true"]
  - name: 4. Certificate
    group: 1. Core
    url: https://nginx/
    <<: *defaults
    conditions: ["[CERTIFICATE_EXPIRATION] > 336h"]
  - name: 1. API response time
    group: 2. Performance
    url: https://nginx/api/health/ready
    <<: *defaults
    conditions: ["[RESPONSE_TIME] < 500"]
  - name: 2. Website response time
    group: 2. Performance
    url: https://nginx/
    <<: *defaults
    conditions: ["[RESPONSE_TIME] < 1000"]
  - name: 1. Grafana
    group: 3. Observability
    url: https://nginx/grafana/api/health
    <<: *defaults
    conditions: ["[STATUS] == 200"]
  - name: 2. Prometheus
    group: 3. Observability
    url: http://prometheus:9090/-/ready
    <<: *defaults
    conditions: ["[STATUS] == 200"]
  - name: 3. Loki
    group: 3. Observability
    url: http://loki:3100/ready
    <<: *defaults
    conditions: ["[STATUS] == 200"]
  - name: 4. Tempo
    group: 3. Observability
    url: http://tempo:3200/ready
    <<: *defaults
    conditions: ["[STATUS] == 200"]
  - name: 5. Alloy
    group: 3. Observability
    url: http://alloy:12345/-/ready
    <<: *defaults
    conditions: ["[STATUS] == 200"]

external-endpoints:
  - name: Backup
    group: 4. Jobs
    token: ${STATUS_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 26h
  - name: Certificate renewal
    group: 4. Jobs
    token: ${STATUS_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 26h
