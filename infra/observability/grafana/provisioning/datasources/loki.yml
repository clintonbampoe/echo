apiVersion: 1
# The old Prometheus entry lived here too, causing a duplicate; gone now,
# prometheus.yml owns it (deleteDatasources cleans up the leftover).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 500
      derivedFields:
        # Native OTLP logs: trace_id lives in structured metadata, not the line.
        # Type "label" matches labels AND structured metadata keys.
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          urlDisplayLabel: View trace
          url: '$${__value.raw}'
