apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{ service_name=~"Echo.Api|nginx" } | trace_id= `$$__trace.traceId`'
        spanStartTimeShift: 1h
        spanEndTimeShift: -1h
