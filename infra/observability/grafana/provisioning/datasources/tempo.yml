apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      # From a trace, jump to its logs: the API's (native OTLP, trace_id in structured metadata) and nginx's request line
      # (the same trace_id, written by Alloy). service_name is a label on both.
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{ service_name=~"Echo.Api|nginx" } | trace_id= `$$__trace.traceId`'
        spanStartTimeShift: 1h
        spanEndTimeShift: -1h
