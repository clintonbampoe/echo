---
services:
  loki:
    ports: ['${OBS_BIND_IP:?set OBS_BIND_IP}:3100:3100']
  prometheus:
    ports: ['${OBS_BIND_IP}:9090:9090']
  tempo:
    ports: ['${OBS_BIND_IP}:4317:4317']
  grafana:
    environment:
      GF_SERVER_DOMAIN: ${OBS_DOMAIN:?set OBS_DOMAIN}
      GF_SERVER_ROOT_URL: https://${OBS_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: 'true'
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 7d
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
  proxy:
    image: ${IMAGE_REGISTRY:-local}/echo-obs-proxy:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: infra/observability/proxy/Dockerfile
    container_name: proxy
    restart: unless-stopped
    environment:
      OBS_DOMAIN: ${OBS_DOMAIN:?set OBS_DOMAIN}
    ports: [80:80, 443:443]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      grafana:
        condition: service_healthy
  certbot:
    image: ${IMAGE_REGISTRY:-local}/echo-certbot:${IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: infra/certbot/Dockerfile
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
volumes:
  letsencrypt:
  certbot-webroot:
