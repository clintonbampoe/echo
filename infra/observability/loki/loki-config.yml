auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-10-29"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 672h
  # nginx writes a line for every request, so its logs are the bulk of the volume and the least useful after
  # a fortnight. Everything else keeps 28 days.
  retention_stream:
    - selector: '{container="nginx"}'
      priority: 1
      period: 336h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
