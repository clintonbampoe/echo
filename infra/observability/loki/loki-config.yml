auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-10-29"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 672h
  # By value, not by source. Warnings and errors (nginx 4xx and 5xx, the API, Postgres) are few and are what an
  # investigation starts from, so they keep 28 days. nginx writes a line for every request it logs, which is the bulk
  # of the volume, and carries addresses and browser strings: a week is enough to compare with last week.
  # When a stream matches more than one rule, the higher priority wins, so an nginx error line keeps 28 days.
  retention_stream:
    - selector: '{level=~"warn|error"}'
      priority: 2
      period: 672h
    - selector: '{container="nginx"}'
      priority: 1
      period: 168h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
