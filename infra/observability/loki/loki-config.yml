auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  instance_addr: 127.0.0.1
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-10-29"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-672h}
  retention_stream:
    - selector: '{level=~"warn|error"}'
      priority: 2
      period: ${LOKI_RETENTION:-672h}
    - selector: '{container="nginx"}'
      priority: 1
      period: ${LOKI_NGINX_RETENTION:-168h}

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
