name: obs

services:
  loki:
      build: ./loki
      container_name: loki
      restart: unless-stopped
      ports:
        - "127.0.0.1:3100:3100"
      volumes:
        - loki-data:/loki
  
  prometheus:
    build: ./prometheus
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
      # The API's metrics arrive over OTLP, which says when each counter started. With this feature on, Prometheus records
      # a zero at that moment, so a counter's FIRST event counts: otherwise increase() and rate() ignore the first sample
      # of a new series, and the first failed login, the first 500, the first hit of a summary never show on a dashboard.
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tempo: 
    build: ./tempo
    container_name: tempo
    restart: unless-stopped
    volumes:
      - tempo-data:/var/tempo
  
  grafana:
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started 
      tempo: 
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  tempo-data:
