---
name: obs
services:
  loki:
    image: ${IMAGE_REGISTRY:-local}/echo-loki:${IMAGE_TAG:-dev}
    build: ./loki
    container_name: loki
    restart: unless-stopped
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-672h}
      LOKI_NGINX_RETENTION: ${LOKI_NGINX_RETENTION:-168h}
    ports: [127.0.0.1:3100:3100]
    volumes: [loki-data:/loki]
  prometheus:
    image: ${IMAGE_REGISTRY:-local}/echo-prometheus:${IMAGE_TAG:-dev}
    build: ./prometheus
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion,native-histograms
    ports: [127.0.0.1:9090:9090]
    volumes: [prometheus-data:/prometheus]
    healthcheck:
      test: [CMD, wget, -q, -O, '-', http://127.0.0.1:9090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  tempo:
    image: ${IMAGE_REGISTRY:-local}/echo-tempo:${IMAGE_TAG:-dev}
    build: ./tempo
    container_name: tempo
    restart: unless-stopped
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
    volumes: [tempo-data:/var/tempo]
  grafana:
    image: ${IMAGE_REGISTRY:-local}/echo-grafana:${IMAGE_TAG:-dev}
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    ports: [127.0.0.1:3000:3000]
    volumes: [grafana-data:/var/lib/grafana]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  tempo-data:
