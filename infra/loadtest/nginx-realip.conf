# Load test only. k6 runs on the host and gives each church its own address in X-Forwarded-For (lib/ip.js). Without
# this, nginx would see every request as coming from the Docker gateway, count them all against one address, and
# refuse most of them. With it, nginx counts each church by its own address, as it would in production.
# Never mount this in production: it would let any caller choose the address the rate limit counts.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
