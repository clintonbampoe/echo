---
# On top of the usual files, started with infra/loadtest/up.sh. The whole stack
# runs on the same 4 CPUs (two cores with both threads on this machine), like
# the 4-vCPU production server. cpu_shares in docker-compose.prod.yml decide who
# wins when they are busy. run.sh keeps k6 on the other cores. Change the CPUs
# with APP_CPUS when starting the stack.
x-cpus: &cpus "${APP_CPUS:-0,1,4,5}"
services:
  api:
    cpuset: *cpus
  db:
    cpuset: *cpus
  nginx:
    cpuset: *cpus
    volumes:
      - ./infra/loadtest/nginx-realip.conf:/etc/nginx/extra/realip.conf:ro
  alloy:
    cpuset: *cpus
  loki:
    cpuset: *cpus
  prometheus:
    cpuset: *cpus
    ports: [127.0.0.1:9090:9090]
  tempo:
    cpuset: *cpus
  grafana:
    cpuset: *cpus
