---
name: Deploy
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Release to deploy or go back to, e.g. v0.1.9
        required: true
concurrency: deploy
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion
      == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ github.event.workflow_run.head_branch || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - name: Connect
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host app
            HostName $HOST
            User $USER_NAME
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
      - name: Deploy
        run: |-
          mkdir release
          cp docker-compose.yml docker-compose.prod.yml release/
          cp infra/deploy/deploy.sh release/deploy.sh
          cp infra/nginx/certs.sh release/certs.sh
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" > release/release.env
          echo "IMAGE_TAG=$VERSION" >> release/release.env
          tar -C release -c . | ssh app "upload $VERSION"
          ssh -n app "deploy $VERSION"
