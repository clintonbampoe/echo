---
name: Release app
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - global.json
      - infra/nginx/**
      - infra/alloy/**
      - infra/postgres/**
      - infra/certbot/**
      - docker-compose*.yml
      - .github/workflows/release-app.yaml
  workflow_dispatch:
concurrency: release-app
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: echo-api, context: ., dockerfile: backend/src/Echo.Api/Dockerfile}
          - {name: echo-migrator, context: ., dockerfile: backend/src/Echo.MigrationService/Dockerfile}
          - {name: echo-nginx, context: ., dockerfile: infra/nginx/Dockerfile}
          - {name: echo-alloy, context: infra/alloy, dockerfile: infra/alloy/Dockerfile}
          - {name: echo-postgres, context: ., dockerfile: infra/postgres/Dockerfile}
          - {name: echo-certbot, context: ., dockerfile: infra/certbot/Dockerfile}
          - {name: echo-backup, context: ., dockerfile: infra/postgres/backup/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
