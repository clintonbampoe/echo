---
name: Echo CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scope.outputs.api }}
      frontend: ${{ steps.scope.outputs.frontend }}
      infra: ${{ steps.scope.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Work out what the pull request touches
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          files=
          [[ $EVENT != pull_request ]] || files=$(git diff --name-only HEAD^1 HEAD)
          out() {
            if [[ $EVENT != pull_request ]] || grep -qE "$2" <<< "$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }
          {
            out api '^(backend/|global\.json$|\.github/workflows/ci\.yaml$)'
            out frontend '^(frontend/|\.github/workflows/ci\.yaml$)'
            out infra '^(infra/|docs/|\.github/|docker-compose[^/]*\.yml$|.*\.md$)'
          } >> "$GITHUB_OUTPUT"
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/
          key: nuget-${{ hashFiles('backend/Directory.Packages.props', 'backend/src/**/*.csproj') }}
          restore-keys: nuget-
      - name: Restore
        run: dotnet restore backend/Echo.slnx
      - name: Build
        run: dotnet build backend/Echo.slnx --no-restore -c Release
      - name: Test
        run: dotnet test --solution backend/Echo.slnx --filter "Category=Unit" --no-restore
          --no-build -c Release
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_OPTS: -S warning
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell scripts
        run: git ls-files 'infra/*.sh' docs/check-links.sh | xargs shellcheck
      - name: Workflows
        run: docker run --rm -e SHELLCHECK_OPTS -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
      - name: Compose files
        run: |
          infra/deploy/make-env.sh --out "$RUNNER_TEMP/ci.env" \
            --domain example.com --email ops@example.com \
            --mail-from accounts@example.com --resend-key re_ci
          docker compose --env-file "$RUNNER_TEMP/ci.env" --profile '*' config -q
          docker compose --env-file "$RUNNER_TEMP/ci.env" \
            -f docker-compose.yml -f docker-compose.prod.yml --profile '*' config -q
      - name: Deploy entry script
        run: infra/deploy/test-server-entry.sh
      - name: Docs links
        run: docs/check-links.sh
  ci:
    if: always()
    needs: [changes, api, frontend, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          [[ $CHANGES == success ]]
          for result in $RESULTS; do
            [[ $result == success || $result == skipped ]]
          done
