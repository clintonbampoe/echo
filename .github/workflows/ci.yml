---
name: Echo CI
on:
  push:
    branches: [main]
    paths: [backend/**]
  pull_request:
    branches: [main]
    paths: [backend/**]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/
          key: nuget-${{ hashFiles('backend/Directory.Packages.props', 'backend/src/**/*.csproj') }}
          restore-keys: nuget-
      - name: Restore
        run: dotnet restore backend/src/Echo.Api/Echo.Api.csproj
      - name: Build
        run: dotnet build backend/src/Echo.Api/Echo.Api.csproj --no-restore -c Release
      - name: Tests
        run: dotnet test backend/src/Echo.Api/Echo.Api.csproj --no-build -c Release
        continue-on-error: true
