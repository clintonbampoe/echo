---
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    mem_limit: 1g
    memswap_limit: 1g
    stop_grace_period: 35s
    restart: unless-stopped
  db:
    cpu_shares: 2048
    mem_limit: 2560m
    memswap_limit: 2560m
    shm_size: 256m
    oom_score_adj: -500
    stop_grace_period: 60s
    restart: unless-stopped
  nginx:
    cpu_shares: 2048
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports: [80:80, 443:443]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
  backup:
    cpu_shares: 128
    mem_limit: 512m
    memswap_limit: 512m
  migrator:
    mem_limit: 512m
    memswap_limit: 512m
  certbot:
    image: ${IMAGE_REGISTRY:-local}/echo-certbot:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/certbot/Dockerfile
    cpu_shares: 128
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    environment:
      STATUS_HEARTBEAT_TOKEN: ${STATUS_HEARTBEAT_TOKEN:?set STATUS_HEARTBEAT_TOKEN}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks: [echo-network]
  alloy:
    cpu_shares: 512
    mem_limit: 256m
    memswap_limit: 256m
  prometheus:
    cpu_shares: 256
    mem_limit: 1g
    memswap_limit: 1g
  loki:
    cpu_shares: 256
    mem_limit: 768m
    memswap_limit: 768m
  tempo:
    cpu_shares: 256
    mem_limit: 512m
    memswap_limit: 512m
  grafana:
    cpu_shares: 256
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      GF_SERVER_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      GF_SERVER_ROOT_URL: https://${APP_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: 'true'
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 7d
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
  status:
    cpu_shares: 128
    mem_limit: 128m
    memswap_limit: 128m
volumes:
  letsencrypt:
  certbot-webroot:
