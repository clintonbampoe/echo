---
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    mem_limit: 800m
    memswap_limit: 800m
    stop_grace_period: 35s
    restart: unless-stopped
  db:
    cpu_shares: 2048
    mem_limit: 2g
    memswap_limit: 2g
    shm_size: 256m
    oom_score_adj: -500
    stop_grace_period: 60s
    restart: unless-stopped
  nginx:
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    cpu_shares: 2048
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports: [80:80, 443:443]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
  backup:
    mem_limit: 512m
    memswap_limit: 512m
    cpu_shares: 128
  certbot:
    image: ${IMAGE_REGISTRY:-local}/echo-certbot:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/certbot/Dockerfile
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
volumes:
  letsencrypt:
  certbot-webroot:
