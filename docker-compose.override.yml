---
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: 'true'
    volumes:
      - /build/src/Echo.Api/bin
      - /build/src/Echo.Api/obj
      - /build/src/Echo.Application/bin
      - /build/src/Echo.Application/obj
      - /build/src/Echo.Auth/bin
      - /build/src/Echo.Auth/obj
      - /build/src/Echo.Shared/bin
      - /build/src/Echo.Shared/obj
      - /build/src/Echo.Domain/bin
      - /build/src/Echo.Domain/obj
      - /build/src/Echo.Data/bin
      - /build/src/Echo.Data/obj
      - /build/src/Echo.ServiceDefaults/obj
      - /build/src/Echo.ServiceDefaults/bin
      - nuget-cache:/root/.nuget/packages
    ports: [5025:5025]
  db:
    ports: [5432:5432]
  nginx:
    build:
      target: dev
    ports: [8080:80]
    depends_on:
      client:
        condition: service_started
  client:
    container_name: frontend
    environment:
      VITE_API_URL: /api
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes: [./frontend:/app, /app/node_modules]
    ports: [5173:5173]
    depends_on:
      api:
        condition: service_healthy
    networks: [echo-network]
  alloy:
    ports: [127.0.0.1:4317:4317, 127.0.0.1:4318:4318, 127.0.0.1:12345:12345]
  loki:
    ports: [127.0.0.1:3100:3100]
  prometheus:
    ports: [127.0.0.1:9090:9090]
  grafana:
    ports: [127.0.0.1:3000:3000]
volumes:
  nuget-cache:
