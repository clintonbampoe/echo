---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '10'
services:
  api:
    image: ${IMAGE_REGISTRY:-local}/echo-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend/src/Echo.Api/Dockerfile
    logging: *default-logging
    container_name: api
    environment:
      ConnectionStrings__echodb: ${ConnectionStrings__echodb}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_TRACES_SAMPLER: parentbased_always_on
      Logging__LogLevel__Default: ${API_LOG_LEVEL:-Warning}
      Jwt__PrivateKey: ${Jwt__PrivateKey}
      Jwt__PublicKey: ${Jwt__PublicKey}
      Jwt__PreviousPublicKey: ${Jwt__PreviousPublicKey:-}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
      Api__BaseUrl: ${Api__BaseUrl}
      Frontend__BaseUrl: ${Frontend__BaseUrl}
      MailClient__Address: ${MailClient__Address}
      Resend__ApiKey: ${Resend__ApiKey}
      Invitations__CodeKey: ${Invitations__CodeKey}
      RunMigrationsOnStartup: ${RunMigrationsOnStartup}
    volumes: [api-keys:/root/.aspnet/DataProtection-Keys]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:5025/api/health/live]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
  db:
    image: ${IMAGE_REGISTRY:-local}/echo-postgres:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    logging: *default-logging
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [echo-network]
  nginx:
    image: ${IMAGE_REGISTRY:-local}/echo-nginx:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    logging: *default-logging
    container_name: nginx
    depends_on:
      api:
        condition: service_healthy
    networks: [echo-network]
  backup:
    image: ${IMAGE_REGISTRY:-local}/echo-backup:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/postgres/backup/Dockerfile
    logging: *default-logging
    container_name: backup
    environment:
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      STATUS_HEARTBEAT_TOKEN: ${STATUS_HEARTBEAT_TOKEN:?set STATUS_HEARTBEAT_TOKEN}
    volumes: ['${BACKUP_DIR:-./infra/postgres/backup/dumps}:/app/dumps']
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
    restart: unless-stopped
  migrator:
    image: ${IMAGE_REGISTRY:-local}/echo-migrator:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend/src/Echo.MigrationService/Dockerfile
    logging: *default-logging
    container_name: migrator
    environment:
      ConnectionStrings__echodb: ${ConnectionStrings__echodb}
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
  seeder:
    build:
      context: .
      dockerfile: backend/src/Echo.Seeder/Dockerfile
    logging: *default-logging
    container_name: seeder
    environment:
      ConnectionStrings__echodb: ${ConnectionStrings__echodb}
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
  alloy:
    image: ${IMAGE_REGISTRY:-local}/echo-alloy:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/alloy/Dockerfile
    logging: *default-logging
    container_name: alloy
    restart: unless-stopped
    hostname: ${ALLOY_HOST:-echo-app}
    environment:
      GOMEMLIMIT: 200MiB
      PG_MONITOR_DSN: postgresql://monitor:${MONITOR_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      API_LOG_MIN_SEVERITY: ${API_LOG_MIN_SEVERITY:-13}
      TRACES_SAMPLE_PERCENT: ${TRACES_SAMPLE_PERCENT:-1}
    cgroup: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/udev:/run/udev:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    networks: [echo-network]
    profiles: [obs]
  loki:
    image: ${IMAGE_REGISTRY:-local}/echo-loki:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/observability/loki/Dockerfile
    logging: *default-logging
    container_name: loki
    restart: unless-stopped
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-672h}
      LOKI_NGINX_RETENTION: ${LOKI_NGINX_RETENTION:-168h}
    volumes: [loki-data:/loki]
    networks: [echo-network]
    profiles: [obs]
  prometheus:
    image: ${IMAGE_REGISTRY:-local}/echo-prometheus:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/observability/prometheus/Dockerfile
    logging: *default-logging
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion,native-histograms
    volumes: [prometheus-data:/prometheus]
    healthcheck:
      test: [CMD, wget, -q, -O, '-', http://127.0.0.1:9090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [echo-network]
    profiles: [obs]
  tempo:
    image: ${IMAGE_REGISTRY:-local}/echo-tempo:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/observability/tempo/Dockerfile
    logging: *default-logging
    container_name: tempo
    restart: unless-stopped
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
    volumes: [tempo-data:/var/tempo]
    networks: [echo-network]
    profiles: [obs]
  grafana:
    image: ${IMAGE_REGISTRY:-local}/echo-grafana:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/observability/grafana/Dockerfile
    logging: *default-logging
    container_name: grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes: [grafana-data:/var/lib/grafana]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [echo-network]
    profiles: [obs]
  status:
    image: ${IMAGE_REGISTRY:-local}/echo-status:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infra/status/Dockerfile
    logging: *default-logging
    container_name: status
    restart: unless-stopped
    environment:
      STATUS_HEARTBEAT_TOKEN: ${STATUS_HEARTBEAT_TOKEN:?set STATUS_HEARTBEAT_TOKEN}
    volumes: [status-data:/data]
    networks: [echo-network]
    profiles: [obs]
networks:
  echo-network:
volumes:
  api-keys:
  postgres-data:
  alloy-data:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  status-data:
