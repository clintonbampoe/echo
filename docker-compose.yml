---
services:
  api:
    build:
      context: .
      dockerfile: backend/src/Echo.Api/Dockerfile
    environment:
      Database__Host: db
      Database__Port: ${Database__Port}
      Database__Name: ${Database__Name}
      Database__Username: ${Database__Username}
      Database__Password: ${Database__Password}
      Jwt__PrivateKey: ${Jwt__PrivateKey}
      Jwt__PublicKey: ${Jwt__PublicKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
      Frontend__BaseUrl: ${Frontend__BaseUrl}
      MailClient__Address: ${MailClient__Address}
      Resend__ApiKey: ${Resend__ApiKey}
      RunMigrationsOnStartup: ${RunMigrationsOnStartup}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/api/health/live]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${Database__Name}
      POSTGRES_USER: ${Database__Username}
      POSTGRES_PASSWORD: ${Database__Password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init/extensions.sql:/docker-entrypoint-initdb.d/extensions.sql
      - ./infra/postgres/backup/db_dumps:/db_dumps:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${Database__Username} -d ${Database__Name}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [echo-network]
  nginx:
    image: nginx:latest
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api:
        condition: service_healthy
    networks: [echo-network]
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks: [echo-network]
  backup:
    build:
      context: .
      dockerfile: infra/postgres/backup/Dockerfile
    environment:
      DB_NAME: ${Database__Name}
      DB_USERNAME: ${Database__Username}
      PGPASSWORD: ${Database__Password}
    volumes:
      - ./infra/postgres/backup/backup.sh:/app/backup.sh:ro
      - ./infra/postgres/backup/restore.sh:/app/restore.sh:ro
      - ./infra/postgres/backup/dumps/:/app/dumps
    # Entry point is defined per environment in override/prod files
    # Since schedule differs between dev and prod
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
    restart: unless-stopped
  migrator:
    build:
      context: .
      target: build
      dockerfile: backend/src/Echo.Api/Dockerfile
    environment:
      Database__Host: db
      Database__Port: 5432
      Database__Name: ${Database__Name}
      Database__Username: ${Database__Username}
      Database__Password: ${Database__Password}
      ASPNETCORE_ENVIRONMENT: Development
    entrypoint:
      - sh
      - -c
      - dotnet tool restore && dotnet ef database update --project src/Echo.Infrastructure
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
networks:
  echo-network:
volumes:
  postgres-data:
