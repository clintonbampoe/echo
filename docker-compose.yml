---
# Docker's default json-file driver never rotates. Every service below inherits
# this anchor so no container can fill the host disk with logs (50 MiB ceiling
# each: 10 MiB x 5 files).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '10'
services:
  api:
    build:
      context: .
      dockerfile: backend/src/Echo.Api/Dockerfile
    logging: *default-logging
    container_name: api
    environment:
      ConnectionStrings__echodb: ${ConnectionStrings__echodb}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      # How often the API pushes its metrics. The default is 60 s, which makes a dashboard trail what just happened by a
      # minute or more. 15 s costs nothing at this size.
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      Jwt__PrivateKey: ${Jwt__PrivateKey}
      Jwt__PublicKey: ${Jwt__PublicKey}
      # Only set during a key rotation grace period; empty the rest of the time.
      Jwt__PreviousPublicKey: ${Jwt__PreviousPublicKey:-}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
      Api__BaseUrl: ${Api__BaseUrl}
      Frontend__BaseUrl: ${Frontend__BaseUrl}
      MailClient__Address: ${MailClient__Address}
      Resend__ApiKey: ${Resend__ApiKey}
      Invitations__CodeKey: ${Invitations__CodeKey}
      RunMigrationsOnStartup: ${RunMigrationsOnStartup}
    volumes:
      # ASP.NET writes its data-protection keys here; without a volume they are lost on every rebuild.
      - api-keys:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: [CMD, curl, -f, http://localhost:5025/api/health/live]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
  db:
    image: postgres:18
    logging: *default-logging
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USERNAME: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init/extensions.sql:/docker-entrypoint-initdb.d/extensions.sql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/conf:/etc/postgresql/conf.d:ro
      - ./infra/postgres/backup/db_dumps:/db_dumps:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [echo-network]
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    logging: *default-logging
    container_name: nginx
    depends_on:
      api:
        condition: service_healthy
    networks: [echo-network]
  backup:
    build:
      context: .
      dockerfile: infra/postgres/backup/Dockerfile
    logging: *default-logging
    container_name: backup
    environment:
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./infra/postgres/backup/backup.sh:/app/backup.sh:ro
      - ./infra/postgres/backup/restore.sh:/app/restore.sh:ro
      - ./infra/postgres/backup/dumps/:/app/dumps
    # Entry point is defined per environment in override/prod files
    # Since schedule differs between dev and prod
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
    restart: unless-stopped
  migrator:
    build:
      context: .
      dockerfile: backend/src/Echo.MigrationService/Dockerfile
    logging: *default-logging
    container_name: migrator
    environment:
      ConnectionStrings__echodb: ${ConnectionStrings__echodb}
    depends_on:
      db:
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
  seeder:
    build:
      context: .
      dockerfile: backend/src/Echo.Seeder/Dockerfile
    logging: *default-logging
    container_name: seeder
    environment:
      ConnectionStrings__echodb: ${ConnectionStrings__echodb}
    depends_on:
      db: 
        condition: service_healthy
    networks: [echo-network]
    profiles: [db-tools]
networks:
  echo-network:
volumes:
  api-keys:
  postgres-data:
